title: 80,000 Hours Jobs Archive
description: Daily-refreshed mirror of every job posting from the 80,000 Hours job board.

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Apply the `default` layout to every .md page (index + every job + closed jobs).
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - node_modules
  - src
  - test
  - .github
  - package.json
  - pnpm-lock.yaml
  - tsconfig.json
