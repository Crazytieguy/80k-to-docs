name: sync
on:
  schedule:
    - cron: '17 6 * * *'    # 06:17 UTC daily; off-the-hour to avoid GH cron throttling
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx src/sync.ts
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          AREA_TAGS: ${{ vars.AREA_TAGS }}
      - name: Commit state
        if: always()
        run: |
          set -euo pipefail
          # Validate state file parses (guards against truncation from a crashed sync.ts).
          node -e "JSON.parse(require('fs').readFileSync('state/jobs.json','utf8'))"
          git config user.name "80k-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/jobs.json
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Defensive rebase before push (cheap; concurrency block should prevent conflicts).
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
