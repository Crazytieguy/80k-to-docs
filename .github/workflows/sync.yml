name: sync
on:
  schedule:
    - cron: '17 6 * * *'    # 06:17 UTC daily; off-the-hour to avoid GH cron throttling
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx src/sync.ts
        env:
          AREA_TAGS: ${{ vars.AREA_TAGS }}
      - name: Commit changes
        if: always()
        run: |
          set -euo pipefail
          git config user.name "80k-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A jobs INDEX.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Defensive rebase before push (cheap; concurrency block should prevent conflicts).
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
